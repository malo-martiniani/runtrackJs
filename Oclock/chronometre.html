<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Oclock</title>
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Horloge</a>
            <a href="minuteur.html">Minuteur</a>
            <a href="chronometre.html">Chronomètre</a>
            <a href="reveil.html">Réveil</a>
        </nav>
    </header>
    <main class="container">
        <h1>Chronomètre</h1>
        <div class="card">
            <div id="chrono-display" class="clock">00:00:00</div>
            <div class="buttons">
                <button id="chrono-toggle">Démarrer</button>
                <button id="chrono-lap" disabled>Tour</button>
                <button id="chrono-reset" disabled>Reset</button>
            </div>
            <div class="laps">
                <h2>Vos tours</h2>
                <ul id="chrono-laps" class="laps-list">
                    <li>Aucun tour enregistré.</li>
                </ul>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
