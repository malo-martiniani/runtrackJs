<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Oclock</title>
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Horloge</a>
            <a href="minuteur.html">Minuteur</a>
            <a href="chronometre.html">Chronomètre</a>
            <a href="reveil.html">Réveil</a>
        </nav>
    </header>
    <main class="container">
        <h1>Réveil</h1>
        <div class="card">
            <form class="alarm-form">
                <input type="time" id="alarm-time" required aria-label="Heure de l'alarme">
                <input type="text" id="alarm-message" placeholder="Message" required aria-label="Message de l'alarme">
                <button id="add-alarm">Ajouter</button>
            </form>
            <h2>Alarms programmées</h2>
            <ul id="alarm-list" class="alarm-list">
                <li>Aucune alarme programmée.</li>
            </ul>
        </div>
    </main>
    <script src="script.js"></script>
</body>
